name: SonarCloud
on:
  # push:
  #   branches:
  #     - main
  pull_request:
    types: [opened, synchronize, reopened]
jobs:
  build:
    name: Build and analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis
      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68  # v6
        with:
          dotnet-version: 10.x
      - name: Cache SonarCloud packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6
        with:
          path: |
            ~/.nuget/packages
            ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar
      - name: Cache SonarCloud tooling
        id: cache-sonar-scanner
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6
        with:
          path: ./.sonar
          key: ${{ runner.os }}-sonar-scanner
          restore-keys: ${{ runner.os }}-sonar-scanner
      - name: Install SonarCloud scanner and coverage tooling
        if: steps.cache-sonar-scanner.outputs.cache-hit != 'true'
        shell: bash
        run: |
          dotnet tool update dotnet-sonarscanner --tool-path ./.sonar/scanner
          dotnet tool update dotnet-coverage --tool-path ./.sonar/tools --version 18.11.2
      - name: Build and analyze
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # Needed to get PR information, if any
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        shell: bash
        run: |
          # Explicit shell semantics: any command failure aborts the script
          # (no exit-code swallowing like PowerShell's $LASTEXITCODE).
          set -euo pipefail
          # Host entry points are excluded from coverage: the CSR tool and the Samplekubelet host
          # bootstrap need a running cluster and cannot be meaningfully unit tested.
          ./.sonar/scanner/dotnet-sonarscanner begin /k:"jimfim_Sharplet" /o:"jimfim" /d:sonar.token="$SONAR_TOKEN" /d:sonar.host.url="https://sonarcloud.io" /d:sonar.cs.vscoveragexml.reportsPaths="coverage-*.xml" /d:sonar.coverage.exclusions="src/Sharplet.CSR/**;src/Sharplet.Samplekubelet/Program.cs"
          dotnet build src
          # The xunit.v3 (Microsoft.Testing.Platform) test projects are self-executing
          # apps: `dotnet test` exits without running them, so invoke the built test
          # assemblies directly. The scanner for .NET does not instrument the build or
          # collect coverage in-process, so wrap each run in dotnet-coverage to produce
          # the VS Code Coverage XML report the scanner imports via
          # sonar.cs.vscoveragexml.reportsPaths (see the quality-gate "new coverage"
          # condition). dotnet-coverage returns the test run's exit code; keep running
          # the remaining test projects and fail the step at the end if any failed.
          failed=false
          for dir in src/*.Tests; do
              name=$(basename "$dir")
              ./.sonar/tools/dotnet-coverage collect "dotnet ${dir}/bin/Debug/net10.0/${name}.dll" -f xml -o "coverage-${name}.xml" || failed=true
          done
          if [ "$failed" = true ]; then exit 1; fi
          ./.sonar/scanner/dotnet-sonarscanner end /d:sonar.token="$SONAR_TOKEN"
      # dotnet-sonarscanner 'end' exits 0 even when the analysis fails the
      # quality gate; this step polls the gate status from the scan report.
      # continue-on-error keeps the gate informational: a red gate shows as a
      # failed step but never fails the workflow, so only the CI build check
      # (required status check) can block a merge.
      - name: SonarCloud quality gate check
        uses: sonarsource/sonarqube-quality-gate-action@7a5fffe8e523c40e0c740b6bc2712ab503e52efa  # master
        continue-on-error: true
        with:
          pollingTimeoutSec: 600
          scanMetadataReportFile: ./.sonarqube/out/.sonar/report-task.txt
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
