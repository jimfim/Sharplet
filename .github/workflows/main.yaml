# This is a basic workflow to help you get started with Actions

name: CI

# Controls when the action will run. Triggers the workflow on push or pull request
# events for the main and develop branches
on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # Runs on every push and pull request. Make the "CI / build" check required on
  # protected branches (Settings > Branches > Required status checks; select
  # "CI / build", not "SonarCloud / build") so a failing build blocks merges.
  # The SonarCloud quality gate is informational only and never blocks merges.
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest
    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
    # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

    - name: Setup .NET Core
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68  # v6
      with:
        dotnet-version: 10.x
        source-url: https://nuget.pkg.github.com/jimfim/index.json
      env:
        NUGET_AUTH_TOKEN: ${{secrets.GITHUB_TOKEN}}

    # Build; -warnaserror on NU1902..NU1904 fails the build when a direct or
    # transitive package has a known moderate+ severity vulnerability;
    # LockedMode=error fails the build when the committed packages.lock.json files
    # do not match the resolved package versions
    - name: Build and Test
      run: dotnet build src -c Release -p:LockedMode=error -p:NuGetAuditMode=all -warnaserror:NU1902,NU1903,NU1904

  # Only runs on pushes to main/develop (never on pull requests), so a failed
  # publish can neither block a merge nor leak artifacts from a PR.
  # Requires a successful build first.
  release:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

    - name: Fetch all history for all tags and branches
      run: git fetch --prune --unshallow

    - name: Setup .NET Core
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68  # v6
      with:
        dotnet-version: 10.x
        source-url: https://nuget.pkg.github.com/jimfim/index.json
      env:
        NUGET_AUTH_TOKEN: ${{secrets.GITHUB_TOKEN}}

    - name: Determine Version
      id: gitversion # id to later be referenced
      # The gittools actions can only install GitVersion 6.x on current runners,
      # and 6.x no longer treats main as a stable mainline branch, so run the
      # pinned 5.x tool directly to keep main releases stable (0.1.x, not 0.0.1-N)
      env:
        DOTNET_ROLL_FORWARD: Major
      run: |
        dotnet tool install --tool-path .tools GitVersion.Tool --version 5.12.0
        ./.tools/dotnet-gitversion /output json > gitversion.json
        {
          echo "semVer=$(jq -r '.SemVer' gitversion.json)"
          echo "majorMinorPatch=$(jq -r '.MajorMinorPatch' gitversion.json)"
          echo "fullSemVer=$(jq -r '.FullSemVer' gitversion.json)"
        } >> "$GITHUB_OUTPUT"

    - name: Configure Git
      run: |
        git config user.name "$GITHUB_ACTOR"
        git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

    - name: Login to Docker Hub
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Install Helm
      uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310  # v5

    # Build; same vulnerability and lock-file gates as the build job so a
    # vulnerable or drifted package can never be published
    - name: Build and Test
      run: dotnet build -p:version=${{ steps.gitversion.outputs.semVer }} --configuration Release ./src -p:LockedMode=error -p:NuGetAuditMode=all -warnaserror:NU1902,NU1903,NU1904

    #release

    - name: push nuget packages
      env:
        GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
      run: dotnet nuget push "**/*.nupkg" --source "https://nuget.pkg.github.com/jimfim/index.json" --api-key ${{secrets.GITHUB_TOKEN}}

    ## Docker
    - name: Build and push
      uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7
      with:
        file: Dockerfile
        push: true
        tags: jimjim/sharplet:${{ steps.gitversion.outputs.SemVer }}

    ## helm
    - name: Helm Chart Update, Package and Push
      run: |
        cd ./charts/sharplet
        sed -i "s/appVersion\: 0\.0\.0/appVersion\: ${{ steps.gitversion.outputs.SemVer }}/" Chart.yaml
        sed -i "s/version\: 0\.0\.0/version\: ${{ steps.gitversion.outputs.SemVer }}/" Chart.yaml
        cat Chart.yaml

    - name: Run chart-releaser
      uses: helm/chart-releaser-action@cae68fefc6b5f367a0275617c9f83181ba54714f  # v1.7.0
      env:
        CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"