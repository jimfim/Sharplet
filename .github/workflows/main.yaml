# This is a basic workflow to help you get started with Actions

name: CI

# Controls when the action will run. Triggers the workflow on push or pull request
# events for the main and develop branches
on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # Runs on every push and pull request. Make the "CI / build" check required on
  # protected branches (Settings > Branches > Required status checks; select
  # "CI / build", not "SonarCloud / build") so a failing build blocks merges.
  # The SonarCloud quality gate is informational only and never blocks merges.
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest
    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
    # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

    - name: Setup .NET Core
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68  # v6
      with:
        dotnet-version: 10.x
        source-url: https://nuget.pkg.github.com/jimfim/index.json
      env:
        NUGET_AUTH_TOKEN: ${{secrets.GITHUB_TOKEN}}

    # Build; -warnaserror on NU1902..NU1904 fails the build when a direct or
    # transitive package has a known moderate+ severity vulnerability;
    # LockedMode=error fails the build when the committed packages.lock.json files
    # do not match the resolved package versions
    - name: Build and Test
      run: dotnet build src -c Release -p:LockedMode=error -p:NuGetAuditMode=all -warnaserror:NU1902,NU1903,NU1904

  # Only runs on pushes to main/develop (never on pull requests), so a failed
  # publish can neither block a merge nor leak artifacts from a PR.
  # Requires a successful build first.
  release:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

    - name: Fetch all history for all tags and branches
      run: git fetch --prune --unshallow

    - name: Tag main release commit
      # Mainline GitVersion reports stable versions only at tagged commits, so
      # develop-to-main merges get the next minor tag (vA.B.0 -> vA.B+1.0) and
      # publish stable releases. Commits already carrying a version tag keep it,
      # which keeps workflow re-runs idempotent. Direct (non-merge) pushes to
      # main are not releases and keep prerelease versions.
      if: github.ref == 'refs/heads/main'
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        if ! git rev-parse --verify -q HEAD^2 >/dev/null; then
          echo "HEAD is not a merge commit; skipping release tagging"
          exit 0
        fi
        if TAG=$(git describe --tags --exact-match --match 'v[0-9]*' 2>/dev/null) && [ -n "$TAG" ]; then
          echo "HEAD already tagged $TAG; reusing"
          exit 0
        fi
        LAST=$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || echo v0.1.0)
        IFS='.' read -r MAJOR MINOR _ <<< "${LAST#v}"
        NEXT="v${MAJOR}.$((MINOR + 1)).0"
        git tag "$NEXT"
        git push origin "$NEXT"
        echo "tagged $GITHUB_SHA as $NEXT"

    - name: Install GitVersion
      uses: gittools/actions/gitversion/setup@7417b1089e2c7de93510f1901d656ddf60bb024f  # v4
      with:
        versionSpec: '6.x'

    - name: Determine Version
      id:   gitversion # id to later be referenced
      uses: gittools/actions/gitversion/execute@7417b1089e2c7de93510f1901d656ddf60bb024f  # v4

    - name: Configure Git
      run: |
        git config user.name "$GITHUB_ACTOR"
        git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

    - name: Login to Docker Hub
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Install Helm
      uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310  # v5

    - name: Setup .NET Core
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68  # v6
      with:
        dotnet-version: 10.x
        source-url: https://nuget.pkg.github.com/jimfim/index.json
      env:
        NUGET_AUTH_TOKEN: ${{secrets.GITHUB_TOKEN}}

    # Build; same vulnerability and lock-file gates as the build job so a
    # vulnerable or drifted package can never be published
    - name: Build and Test
      run: dotnet build -p:version=${{ steps.gitversion.outputs.semVer }} --configuration Release ./src -p:LockedMode=error -p:NuGetAuditMode=all -warnaserror:NU1902,NU1903,NU1904

    #release

    - name: push nuget packages
      env:
        GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
      run: dotnet nuget push "**/*.nupkg" --source "https://nuget.pkg.github.com/jimfim/index.json" --api-key ${{secrets.GITHUB_TOKEN}}

    ## Docker
    - name: Build and push
      uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7
      with:
        file: Dockerfile
        push: true
        tags: jimjim/sharplet:${{ steps.gitversion.outputs.semVer }}

    ## helm
    - name: Helm Chart Update, Package and Push
      run: |
        cd ./charts/sharplet
        sed -i "s/appVersion\: 0\.0\.0/appVersion\: ${{ steps.gitversion.outputs.semVer }}/" Chart.yaml
        sed -i "s/version\: 0\.0\.0/version\: ${{ steps.gitversion.outputs.semVer }}/" Chart.yaml
        cat Chart.yaml

    - name: Run chart-releaser
      uses: helm/chart-releaser-action@cae68fefc6b5f367a0275617c9f83181ba54714f  # v1.7.0
      env:
        CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"