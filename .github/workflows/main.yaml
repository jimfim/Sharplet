# This is a basic workflow to help you get started with Actions

name: CI

# Controls when the action will run. Triggers the workflow on push or pull request
# events for the main and develop branches
on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # Runs on every push and pull request. Make the "build" check required on
  # protected branches (Settings > Branches) so a failing build blocks merges.
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest
    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
    # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
    - name: Checkout
      uses: actions/checkout@v7

    - name: Setup .NET Core
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.x
        source-url: https://nuget.pkg.github.com/jimfim/index.json
      env:
        NUGET_AUTH_TOKEN: ${{secrets.GITHUB_TOKEN}}

    # Build
    - name: Build and Test
      run: dotnet build src -c Release

  # Only runs on pushes to main/develop (never on pull requests), so a failed
  # publish can neither block a merge nor leak artifacts from a PR.
  # Requires a successful build first.
  release:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Fetch all history for all tags and branches
      run: git fetch --prune --unshallow

    - name: Install GitVersion
      uses: gittools/actions/gitversion/setup@v4
      with:
        versionSpec: '5.x'

    - name: Determine Version
      id:   gitversion # id to later be referenced
      uses: gittools/actions/gitversion/execute@v4

    - name: Configure Git
      run: |
        git config user.name "$GITHUB_ACTOR"
        git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

    - name: Login to Docker Hub
      uses: docker/login-action@v4
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Install Helm
      uses: azure/setup-helm@v5

    - name: Setup .NET Core
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.x
        source-url: https://nuget.pkg.github.com/jimfim/index.json
      env:
        NUGET_AUTH_TOKEN: ${{secrets.GITHUB_TOKEN}}

    # Build
    - name: Build and Test
      run: dotnet build -p:version=${{ steps.gitversion.outputs.semVer }} --configuration Release ./src

    #release

    - name: push nuget packages
      env:
        GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
      run: dotnet nuget push "**/*.nupkg" --source "https://nuget.pkg.github.com/jimfim/index.json" --api-key ${{secrets.GITHUB_TOKEN}}

    ## Docker
    - name: Build and push
      uses: docker/build-push-action@v7
      with:
        file: Dockerfile
        push: true
        tags: jimjim/sharplet:${{ steps.gitversion.outputs.SemVer }}

    ## helm
    - name: Helm Chart Update, Package and Push
      run: |
        cd ./charts/sharplet
        sed -i "s/appVersion\: 0\.0\.0/appVersion\: ${{ steps.gitversion.outputs.SemVer }}/" Chart.yaml
        sed -i "s/version\: 0\.0\.0/version\: ${{ steps.gitversion.outputs.SemVer }}/" Chart.yaml
        cat Chart.yaml

    - name: Run chart-releaser
      uses: helm/chart-releaser-action@v1.7.0
      env:
        CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"