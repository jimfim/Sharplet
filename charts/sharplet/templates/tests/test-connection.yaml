apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "sharplet.fullname" . }}-test-connection"
  labels:
    {{- include "sharplet.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  containers:
    - name: wget
      image: busybox
      command: ['wget']
      # the 10250 kubelet API requires a client certificate; the read-only
      # 10255 listener serves /livez over plain HTTP
      args: ['-qO-', 'http://{{ include "sharplet.fullname" . }}:10255/livez']
  restartPolicy: Never
